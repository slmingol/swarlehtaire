<div class="stack" 
	[class.stack-stock]="stackType === 'stock'"
	[class.stack-waste]="stackType === 'waste'"
	[class.stack-foundation]="stackType === 'foundation'"
	[class.stack-tableau]="stackType === 'tableau'"
	[class.spread-down]="spread === 'down'"
	[class.spread-right]="spread === 'right'"
	[class.drag-over]="isDragOver"
	(click)="onStackClick()"
	(dragover)="onDragOver($event)"
	(dragleave)="onDragLeave()"
	(drop)="onDrop($event)">
	
	@if (cards.length === 0) {
		<app-card></app-card>
	} @else {
		@for (card of cards; track card.id; let i = $index) {
			<div class="card-wrapper"
				[style]="getCardStyle(i)"
				(click)="onCardClick(card, i); passClickThrough || $event.stopPropagation()"
				(pointerdown)="onPointerDown($event, i)"
				(pointermove)="onPointerMove($event)"
				(pointerup)="onPointerUp($event)"
				(pointercancel)="onPointerCancel()">
				<app-card
					[card]="card"
					[draggable]="card.faceUp"
					(dragStart)="onCardDragStart(i)"
					(dragEnd)="onCardDragEnd()"></app-card>
			</div>
		}
	}
</div>

<div class="stack" 
	[class.stack-stock]="stackType === 'stock'"
	[class.stack-waste]="stackType === 'waste'"
	[class.stack-foundation]="stackType === 'foundation'"
	[class.stack-tableau]="stackType === 'tableau'"
	[class.spread-down]="spread === 'down'"
	[class.spread-right]="spread === 'right'"
	[class.drag-over]="isDragOver"
	(click)="onStackClick()"
	(dragover)="onDragOver($event)"
	(dragleave)="onDragLeave()"
	(drop)="onDrop($event)">
	
	@if (cards.length === 0) {
		<app-card></app-card>
	} @else {
		@for (card of cards; track card.id; let i = $index) {
			<div class="card-wrapper" 
				[style]="getCardStyle(i)"
				[class.is-draggable]="card.faceUp && (spread === 'down' ? canDragFrom(i) : true)"
				(click)="onCardClick(card, i); $event.stopPropagation()">
				<app-card 
					[card]="card" 
					[draggable]="card.faceUp && (spread === 'down' ? canDragFrom(i) : true)"
					(dragStart)="onCardDragStart(i)"
					(dragEnd)="onCardDragEnd()"></app-card>
			</div>
		}
	}
</div>

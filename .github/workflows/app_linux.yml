name: 'app-linux'

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: 'ubuntu-26.04'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      - name: Install tauri dependencies
        run: cd resources/apps && npm ci

      - name: Build linux app
        run: |
          cd resources/apps
          npm run linux


      - name: Upload linux artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref_type != 'tag'
        with:
          name: 'linux'
          retention-days: 10
          path: |
            resources/apps/tauri/target/release/bundle/**/*.rpm
            resources/apps/tauri/target/release/bundle/**/*.deb
            resources/apps/tauri/target/release/bundle/**/*.AppImage

      - name: Wait for release
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 20); do
            gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 && exit 0
            echo "Waiting for release to be created ($i/20)..."
            sleep 30
          done
          echo "Release not found after waiting" && exit 1

      - name: Upload release
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find resources/apps/tauri/target/release/bundle \
            \( -name '*.rpm' -o -name '*.deb' -o -name '*.AppImage' \) \
            -exec gh release upload "$GITHUB_REF_NAME" --clobber {} \;
